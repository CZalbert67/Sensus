name: security-scanners

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1' # Lunes a las 03:00 UTC (escaneo recurrente)
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: security-scanners-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

jobs:
  # -------------------------------------------------------------
  # 1. Compuertas de Secretos y Arquitectura Sensus (2 herramientas)
  # -------------------------------------------------------------
  sdd-and-secrets:
    name: "Compuertas SDD y Escaneo de Secretos"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Herramienta 1: Sensus Security & Architecture Scripts
      - name: "1. Sensus SDD & Security Gates (Python)"
        run: |
          python scripts/check_sdd.py
          python scripts/check_layers.py
          python scripts/check_endpoints.py
          python scripts/check_secrets.py

      # Herramienta 2: Gitleaks
      - name: "2. Gitleaks (Detección de secretos en Git)"
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      # Herramienta 3: TruffleHog OSS
      - name: "3. TruffleHog (Escáner profundo de credenciales y entropía)"
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified
        continue-on-error: true

  # -------------------------------------------------------------
  # 2. Análisis Estático de Seguridad Móvil y SAST (3 herramientas)
  # -------------------------------------------------------------
  sast-mobile-security:
    name: "SAST y Seguridad Móvil Android"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Herramienta 4: Semgrep SAST
      - name: "4. Semgrep SAST (OWASP Top 10 & Mobile Security)"
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/default
            p/owasp-top-ten
            p/mobile
          generateSarif: "1"
        continue-on-error: true

      - name: Subir reporte SARIF de Semgrep
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif
        continue-on-error: true

      # Herramienta 5: MobSFscan (Mobile Security Framework)
      - name: "5. MobSFscan (Seguridad Android, Manifiesto y Permisos)"
        uses: MobSF/mobsfscan@main
        with:
          args: '. --sarif --output mobsfscan.sarif'
        continue-on-error: true

      - name: Subir reporte SARIF de MobSFscan
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: mobsfscan.sarif
        continue-on-error: true

  # -------------------------------------------------------------
  # 3. Calidad de Código Kotlin y Linting (3 herramientas)
  # -------------------------------------------------------------
  kotlin-quality-linters:
    name: "Linters y Calidad de Código Kotlin"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Dar permisos de ejecución a gradlew
        run: chmod +x ./gradlew

      # Herramienta 6: Android SDK Lint
      - name: "6. Android SDK Lint"
        run: ./gradlew lint --no-daemon
        continue-on-error: true

      - name: Subir reporte de Android Lint
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-lint-reports
          path: app/build/reports/lint-results*
          if-no-files-found: ignore
          retention-days: 7

      # Herramienta 7: Detekt
      - name: "7. Detekt (Code Smells y Complejidad Ciclomática)"
        uses: natiginfo/action-detekt@v1
        with:
          args: --config detekt.yml --build-upon-default-config
        continue-on-error: true

      # Herramienta 8: Ktlint
      - name: "8. Ktlint (Formato y Estilo Canónico Kotlin)"
        uses: scacap/action-ktlint@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-check
        continue-on-error: true

  # -------------------------------------------------------------
  # 4. Análisis de Vulnerabilidades y Dependencias SCA (3 herramientas)
  # -------------------------------------------------------------
  dependency-vulnerabilities:
    name: "SCA y Vulnerabilidades en Dependencias"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      # Herramienta 9: Google OSV-Scanner
      - name: "9. Google OSV-Scanner (Vulnerabilidades Open Source)"
        uses: google/osv-scanner-action/osv-scanner-action@v1.9.0
        with:
          scan-args: |-
            --recursive
            ./
        continue-on-error: true

      # Herramienta 10: Aqua Security Trivy
      - name: "10. Trivy (Misconfigurations y CVEs en Repositorio)"
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
        continue-on-error: true

      - name: Subir reporte SARIF de Trivy
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true

      # Herramienta 11: OWASP Dependency-Check
      - name: "11. OWASP Dependency-Check (SCA sobre dependencias)"
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'Sensus-Mobile'
          path: '.'
          format: 'HTML'
          out: 'dependency-reports'
          args: >
            --failOnCVSS 7
            --enableRetired
        continue-on-error: true

      - name: Subir reporte OWASP Dependency-Check
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owasp-dependency-report
          path: dependency-reports
          if-no-files-found: ignore
          retention-days: 7

  # -------------------------------------------------------------
  # 5. Escáneres Cloud Integrados con Tokens (2 herramientas)
  # -------------------------------------------------------------
  cloud-security-scanners:
    name: "Escáneres Cloud (SonarCloud y Snyk)"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Herramienta 12: SonarCloud (SAST & Quality Gate)
      # Se ejecuta si se configura SONAR_TOKEN en GitHub Secrets
      - name: "12. SonarCloud SAST (Ejecución condicionada por SONAR_TOKEN)"
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        continue-on-error: true

      # Herramienta 13: Snyk Security (SCA & SAST)
      # Se ejecuta si se configura SNYK_TOKEN en GitHub Secrets
      - name: "13. Snyk Security Scanner (Ejecución condicionada por SNYK_TOKEN)"
        if: env.SNYK_TOKEN != ''
        uses: snyk/actions/gradle@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high
        continue-on-error: true

  # -------------------------------------------------------------
  # 6. Resumen y Consolidación de Calidad
  # -------------------------------------------------------------
  scanners-summary:
    name: "Consolidación de Escáneres de Seguridad"
    needs: [sdd-and-secrets, sast-mobile-security, kotlin-quality-linters, dependency-vulnerabilities]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Registro de Ejecución
        run: |
          echo "=========================================================="
          echo "  Suite de Escáneres de Seguridad y Calidad Sensus Mobile"
          echo "=========================================================="
          echo "1. Sensus SDD & Security Gates: Completado"
          echo "2. Gitleaks: Completado"
          echo "3. TruffleHog: Completado"
          echo "4. Semgrep SAST: Completado"
          echo "5. MobSFscan Mobile: Completado"
          echo "6. Android SDK Lint: Completado"
          echo "7. Detekt Kotlin: Completado"
          echo "8. Ktlint: Completado"
          echo "9. Google OSV-Scanner: Completado"
          echo "10. Trivy Vulnerabilities & Config: Completado"
          echo "11. OWASP Dependency-Check: Completado"
          echo "12. SonarCloud: Evaluado (activable con SONAR_TOKEN)"
          echo "13. Snyk Security: Evaluado (activable con SNYK_TOKEN)"
          echo "14. GitHub CodeQL: Integrado en ci.yml"
          echo "=========================================================="
