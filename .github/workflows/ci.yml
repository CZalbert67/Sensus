name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

# Orden: wrapper -> gates SDD -> SAST -> analisis -> tests -> integracion -> build -> cicd-summary.
# Sin generacion de APK/AAB: el build solo valida compilacion.
jobs:
  validate-wrapper:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/wrapper-validation-action@v2

  sdd-gates:
    needs: validate-wrapper
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Estructura SDD
        run: python scripts/check_sdd.py
      - name: Capas Clean
        run: python scripts/check_layers.py
      - name: Endpoints internos
        run: python scripts/check_endpoints.py
      - name: Secretos
        run: python scripts/check_secrets.py
      - name: Cobertura (SKIP si aun no hay Kover)
        run: python scripts/check_coverage.py --min 80
      - name: Evidencia de gates
        if: always()
        run: |
          {
            echo "## Gates SDD"
            python scripts/check_sdd.py || true
            python scripts/check_layers.py || true
            python scripts/check_endpoints.py || true
            python scripts/check_secrets.py || true
            python scripts/check_coverage.py --min 80 || true
          } > sdd-gates.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sdd-gates
          path: sdd-gates.txt
          if-no-files-found: ignore
          retention-days: 7

  security-scan:
    needs: sdd-gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: chmod +x ./gradlew
      # CodeQL necesita trazar la compilacion. Se compila sin generar APK (regla del proyecto).
      - run: ./gradlew compileDebugKotlin --no-daemon
      - uses: github/codeql-action/analyze@v3

  static-analysis:
    needs: security-scan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-
      - run: chmod +x ./gradlew
      - run: ./gradlew lint --no-daemon

  unit-test:
    needs: static-analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: chmod +x ./gradlew
      - run: ./gradlew testDebugUnitTest --no-daemon
      - name: Subir reporte de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7

  instrumentation-compile:
    needs: unit-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: chmod +x ./gradlew
      - run: ./gradlew compileDebugAndroidTestSources --no-daemon

  build:
    if: github.ref == 'refs/heads/main'
    needs: instrumentation-compile
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: chmod +x ./gradlew
      # Sin APK: solo se valida la compilacion. El AAB firmado se genera en el release manual.
      - run: ./gradlew compileDebugKotlin --no-daemon

  # =========================================================================
  # APARTADO DE CI/CD: Tablero Visual y Resumen de Estado del Pipeline
  # =========================================================================
  cicd-summary:
    name: "Apartado CI/CD — Resumen de Pipeline"
    if: always()
    needs:
      - validate-wrapper
      - sdd-gates
      - security-scan
      - static-analysis
      - unit-test
      - instrumentation-compile
    runs-on: ubuntu-latest
    steps:
      - name: Generar Apartado de CI/CD en Step Summary
        run: |
          echo "# 🚀 Apartado de CI/CD — Resumen de Pipeline Sensus Mobile" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Este tablero resume el estado y cumplimiento de calidad de la ejecución actual en GitHub Actions." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📊 Matriz de Compuertas de Integración Continua" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Etapa del Pipeline | Estado | Herramienta / Validador | Control |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **1. Gradle Wrapper** | ${{ needs.validate-wrapper.result == 'success' && '✅ APROBADO' || '❌ FALLIDO' }} | \`gradle-wrapper-validation\` | Checksum oficial |" >> $GITHUB_STEP_SUMMARY
          echo "| **2. Compuertas SDD & Capas** | ${{ needs.sdd-gates.result == 'success' && '✅ APROBADO' || '❌ FALLIDO' }} | \`check_*.py\` (5 scripts) | Clean Architecture & 0 Secretos |" >> $GITHUB_STEP_SUMMARY
          echo "| **3. SAST Semántico** | ${{ needs.security-scan.result == 'success' && '✅ APROBADO' || '❌ FALLIDO' }} | \`CodeQL (Java/Kotlin)\` | OWASP Mobile Top 10 |" >> $GITHUB_STEP_SUMMARY
          echo "| **4. Análisis Estático** | ${{ needs.static-analysis.result == 'success' && '✅ APROBADO' || '❌ FALLIDO' }} | \`Android SDK Lint\` | Correctitud y accesibilidad |" >> $GITHUB_STEP_SUMMARY
          echo "| **5. Pruebas Unitarias** | ${{ needs.unit-test.result == 'success' && '✅ APROBADO' || '❌ FALLIDO' }} | \`JUnit 5 + MockK + Turbine\` | Umbral de cobertura >= 80% |" >> $GITHUB_STEP_SUMMARY
          echo "| **6. Compilación Instrumentada** | ${{ needs.instrumentation-compile.result == 'success' && '✅ APROBADO' || '❌ FALLIDO' }} | \`AndroidTest Sources\` | Pruebas de integración E2E |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🏷️ Metadatos de la Ejecución" >> $GITHUB_STEP_SUMMARY
          echo "- **Rama:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Evento:** \`${{ github.event_name }}\` por \`${{ github.actor }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Documentación completa de CI/CD:** Ver [\`docs/cicd-pipeline.md\`](docs/cicd-pipeline.md)" >> $GITHUB_STEP_SUMMARY
